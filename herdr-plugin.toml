# Herdr plugin manifest for Agent Tree.
#
# Install:  herdr plugin install sagwaco/herdr-agent-tree
# Open:     herdr plugin action invoke herdr-agent-tree
#
# A "subagent" is an agent Herdr detected in a pane that another agent just
# launched. Herdr does not record that link in its API, so the plugin infers it
# from creation order, tab/workspace, cwd and recent activity. See README.md.

id = "herdr-agent-tree"
name = "Agent Tree"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Tree view of agents and the subagents they launched, declared by orchestrators or inferred"
platforms = ["macos", "linux"]

[[actions]]
id = "herdr-agent-tree"
title = "Agent Tree: open"
description = "Open or focus the agent tree pane"
contexts = ["global"]
command = ["node", "open.mjs"]

[[actions]]
id = "setup"
title = "Agent Tree: set up CLI and skill"
description = "Link the agent-tree CLI and the coding-agent skill into your home directory. The links follow plugin updates."
contexts = ["global"]
command = ["node", "link.mjs"]

[[panes]]
id = "tree"
title = "Agent tree"
placement = "split"
command = ["node", "tree-ui.mjs"]

# Keep the inferred lineage warm while agents start, change state and close.
# pane_agent_detected is the moment a new agent (or subagent) appears.
[[events]]
on = "pane.agent_detected"
command = ["node", "hook.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "hook.mjs"]

[[events]]
on = "pane.focused"
command = ["node", "hook.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "hook.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "hook.mjs"]
